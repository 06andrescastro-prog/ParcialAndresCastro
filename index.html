<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="icon" href="img/logo.svg"><title>Rapadura de Caña · Colombian Panela</title></head><body>
<header id="hdr"></header>
<main>
<div class="wrap hero" id="inicio">
  <div>
    <h1 data-i="hero_t"></h1>
    <p data-i="hero_p"></p>
    <div class="btns"><a class="btn" href="#tienda" data-i="hero_cta"></a><a class="btn alt" href="ar.html" data-i="hero_ar"></a></div>
  </div>
  <img src="img/3-uso.jpg" alt="Rapadura de Caña" onerror="this.onerror=null;this.src='img/pack.png'">
</div>
<div class="wrap vals">
  <div class="val"><b>🌱</b><h3 data-i="v1"></h3><p data-i="v1d"></p></div>
  <div class="val"><b>🍬</b><h3 data-i="v2"></h3><p data-i="v2d"></p></div>
  <div class="val"><b>🤝</b><h3 data-i="v3"></h3><p data-i="v3d"></p></div>
</div>
<section id="tienda"><div class="wrap">
  <h2 data-i="shop_t"></h2><p class="sub" data-i="shop_p"></p>
  <div class="grid" id="grid"></div>
</div></section>
<section class="band" id="historia"><div class="wrap story">
  <div><h2 data-i="story_t" style="text-align:left"></h2><p data-i="story_p1"></p><p data-i="story_p2"></p><p data-i="story_p3"></p></div>
  <img src="img/2-linea.jpg" alt="Rapadura de Caña" onerror="this.onerror=null;this.src='img/pack.png'">
</div></section>
<section><div class="wrap">
  <h2 data-i="gal_t"></h2><p class="sub"></p>
  <div class="gallery">
    <img src="img/4-punto-venta.jpg" alt="" onerror="this.onerror=null;this.src='img/pack.png'">
    <img src="img/5-unboxing.jpg" alt="" onerror="this.onerror=null;this.src='img/pack.png'">
    <img src="img/6-anuncio.jpg" alt="" onerror="this.onerror=null;this.src='img/pack.png'">
  </div>
</div></section>
<section id="envios"><div class="wrap">
  <h2 data-i="ship_t"></h2><p class="sub"></p>
  <div class="info">
    <div class="box"><h3 data-i="ship_h"></h3><ul data-i="ship_l"></ul></div>
    <div class="box"><h3 data-i="pay_h"></h3><p data-i="pay_p"></p>
      <div class="pay"><span>VISA</span><span>Mastercard</span><span>PayPal</span><span>Afterpay</span><span>Apple Pay</span><span>Google Pay</span></div>
      <p style="margin-top:12px" data-i="pay_n"></p></div>
  </div>
</div></section>
<section><div class="wrap ar">
  <div><h2 data-i="ar_t"></h2><p data-i="ar_p"></p><p style="margin-top:16px"><a class="btn" style="background:var(--crm);color:var(--grn)" href="ar.html" data-i="ar_b"></a></p></div>
  <img src="img/qr-ar.png" alt="QR AR" style="max-width:220px;margin:auto;border-radius:12px;background:#fff;padding:10px" onerror="this.style.display='none'">
</div></section>
<section id="contacto"><div class="wrap info">
  <div><h2 data-i="contact_t" style="text-align:left"></h2><p data-i="c_info" style="margin:10px 0"></p></div>
  <form id="cform" class="box">
    <input required data-i="c_name"><input required type="email" data-i="c_email"><textarea rows="4" data-i="c_msg"></textarea>
    <button class="btn" data-i="c_send"></button>
  </form>
</div></section>
</main>
<footer id="ftr"></footer>
<script src="app.js"></script></body></html>
